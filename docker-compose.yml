services:
  panel:
    build: .
    # tini as PID 1 reaps nginx worker zombies; nginx self-daemonizes.
    init: true
    ports:
      - "127.0.0.1:8080:${PANEL_CONTAINER_PORT:-8080}"   # panel UI / API
      - "127.0.0.1:8081:80"     # nginx demo site
    volumes:
      - panel-data:/var/lib/kvzd-panel
      - panel-certs:/var/cert
      - panel-selfsign-certs:/var/cert-self-sign
    environment:
      # Alternative to the interactive init command for a new database.
      PANEL_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${PANEL_BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
    restart: unless-stopped

volumes:
  panel-data:
  panel-certs:
  panel-selfsign-certs:
